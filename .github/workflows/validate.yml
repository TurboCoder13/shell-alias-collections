# SPDX-License-Identifier: MIT
---
name: Quality - Validate Collections
# Validates JSON syntax and schema for all collection files.
# Runs on PRs and pushes to main.

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate JSON & Schema
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Validate JSON syntax
        run: ./scripts/ci/validate-json-syntax.sh

      - name: Validate manifest structure
        run: ./scripts/ci/validate-manifest-structure.sh

      - name: Validate collection files
        run: ./scripts/ci/validate-collection-files.sh
