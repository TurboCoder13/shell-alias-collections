# SPDX-License-Identifier: MIT
---
name: Quality - Validate Collections
# Validates JSON syntax and schema for all collection files.
# Runs on PRs and pushes to main.

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate JSON & Schema
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate JSON syntax
        run: ./scripts/ci/validate-json-syntax.sh

      - name: Validate manifest structure
        run: ./scripts/ci/validate-manifest-structure.sh

      - name: Validate collection files
        run: ./scripts/ci/validate-collection-files.sh
