# SPDX-License-Identifier: MIT
---
name: PR - All Checks Gate
# Keep the gate in its own workflow: it excludes this file to avoid waiting
# on itself. Require `gate / ✅ All Checks Passed` only after verified adoption.

"on":
  push:
    branches: [main]
  pull_request:
    # Title validation also runs on edited PRs.
    types: [opened, edited, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]

permissions: {}

concurrency:
  group: all-checks-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-all-checks-gate.yml@b830ca6972f0c9cbaeb1363283de594f68d66acf # v0.87.0
    with:
      fail-on-draft: true
    permissions:
      actions: read
      checks: read
      contents: read
      statuses: read
