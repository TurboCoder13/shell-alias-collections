# SPDX-License-Identifier: MIT
---
name: Release - Publish GitHub Release
# Creates a GitHub Release when a version tag is pushed.

"on":
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  publish:
    permissions:
      contents: write
    name: Create GitHub Release
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit # TEMP: lgtm-hq/lgtm-ci#1207
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            uploads.github.com:443
            objects.githubusercontent.com:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/ci/publish-github-release.sh "${GITHUB_REF#refs/tags/}"
