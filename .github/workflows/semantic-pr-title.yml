# SPDX-License-Identifier: MIT
---
name: Quality - PR Title Validation
# Validates PR titles follow Conventional Commits format.
# Blocks merges if title format is invalid.

"on":
  pull_request:
    types: [opened, edited, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: semantic-pr-title-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Validate PR title follows Conventional Commits
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          TYPES_INPUT: |
            chore
            ci
            docs
            feat
            fix
            perf
            refactor
            revert
            style
            test
        run: ./scripts/ci/semantic-pr-title-check.sh
