# SPDX-License-Identifier: MIT
---
name: Quality - PR Title Validation
# Validates PR titles follow Conventional Commits format.
# Blocks merges if title format is invalid.

"on":
  pull_request:
    types: [opened, edited, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: semantic-pr-title-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate PR title follows Conventional Commits
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          TYPES_INPUT: |
            chore
            ci
            docs
            feat
            fix
            perf
            refactor
            revert
            style
            test
        run: ./scripts/ci/semantic-pr-title-check.sh
